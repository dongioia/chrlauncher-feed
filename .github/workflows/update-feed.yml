name: update feed

on:
  schedule:
    # every three hours; chrlauncher itself only checks every couple of days
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_feed.py"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/build_feed.py | tee /tmp/feed.log

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat /tmp/feed.log || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          set -euo pipefail
          # status.json carries a timestamp and would otherwise produce a commit
          # on every scheduled run. Only a real change to a served entry is
          # worth a commit; run health lives in the step summary above.
          changed="$(git diff --name-only -- 'api/chrlauncher/windows-*.txt')"
          if [ -z "$changed" ]; then
            echo "feed unchanged"
            git checkout -- api/ || true
            exit 0
          fi
          echo "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/
          git commit -m "feed: refresh $(echo "$changed" | wc -l | tr -d ' ') entries

          $(echo "$changed" | sed 's|api/chrlauncher/||')"
          git push
